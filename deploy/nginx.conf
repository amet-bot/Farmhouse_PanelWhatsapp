# Farmhouse WhatsApp Center - Configuración Nginx (reverse proxy hacia Uvicorn)
# Copiar a /etc/nginx/sites-available/farmhouse y enlazar con:
#   sudo ln -s /etc/nginx/sites-available/farmhouse /etc/nginx/sites-enabled/
#
# Reemplaza "tu-dominio.com" por el dominio real apuntando al VPS.
# Este bloque es la versión PREVIA a Certbot (solo puerto 80). Certbot lo
# reescribe automáticamente para agregar HTTPS (puerto 443) al ejecutar:
#   sudo certbot --nginx -d tu-dominio.com

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte de WebSocket para /ws (chat en tiempo real)
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
