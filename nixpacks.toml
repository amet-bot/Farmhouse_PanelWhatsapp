[phases.setup]
nixPkgs = ["python312", "pkg-config", "gcc", "libffi", "openssl"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
