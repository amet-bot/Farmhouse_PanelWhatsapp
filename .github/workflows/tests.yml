# Corre todas las pruebas del backend en cada push y en cada pull request a main.
# Con "Wait for CI" encendido en Railway (Settings → Deploy), Railway solo despliega un commit
# cuando este flujo pasa: un cambio que rompe algo no llega a producción.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      # Las pruebas usan SQLite en memoria y Meta en modo simulado: no necesitan secretos.
      WHATSAPP_MODE: mock
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # la misma que usa Railway (nixpacks.toml)
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Correr pruebas
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p no:warnings -rfE --tb=line 2>&1 | tee pytest.log

      # Los registros de GitHub solo se ven con sesión; las anotaciones sí se ven en la página
      # del commit. Si algo falla, cada prueba rota queda como anotación con su error.
      - name: Resumen de fallas
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r linea; do echo "::error::${linea:0:900}"; done
          grep -E "^E |Error:|error:" pytest.log | sort | uniq -c | sort -rn | head -5 | while IFS= read -r linea; do echo "::warning::${linea:0:900}"; done
