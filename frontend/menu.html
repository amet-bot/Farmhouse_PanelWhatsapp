<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Menú Farmhouse</title>
  <meta name="theme-color" content="#303d36">
  <link rel="icon" type="image/png" href="/assets/images/farmhouse-logo.png">
  <link rel="apple-touch-icon" href="/assets/images/farmhouse-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fh-green: #303d36;
      --fh-green-dark: #232e28;
      --fh-green-light: #4f6155;
      --fh-gold: #a9834f;
      --fh-bg: #faf7f1;
      --fh-panel: #ffffff;
      --fh-text: #262521;
      --fh-text-muted: #78766d;
      --fh-line: #e7e1d3;
      --radius-lg: 24px;
      --shadow-md: 0 10px 28px rgba(38, 37, 33, 0.08);
      --font-heading: 'Poppins', 'Inter', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fh-green: #5c7266;
        --fh-bg: #1a1815;
        --fh-panel: #242220;
        --fh-text: #f2efe6;
        --fh-text-muted: #b6b0a1;
        --fh-line: #3a372f;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: var(--font-body);
      background: var(--fh-bg);
      color: var(--fh-text);
      line-height: 1.6;
    }

    body { padding-bottom: 100px; }

    /* =============== HEADER =============== */
    .menu-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--fh-bg);
      border-bottom: 1px solid var(--fh-line);
      padding: 16px 20px;
      backdrop-filter: blur(10px);
    }

    .menu-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }

    .menu-logo { width: 40px; height: 40px; }

    .menu-header-titles h1 {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .menu-header-titles span {
      font-size: 12px;
      color: var(--fh-text-muted);
    }

    .menu-search-wrap {
      position: relative;
      flex: 1;
      max-width: 400px;
      display: none;
    }

    @media (min-width: 768px) {
      .menu-search-wrap { display: block; }
    }

    .menu-search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--fh-line);
      border-radius: 20px;
      background: var(--fh-panel);
      color: var(--fh-text);
      font-size: 14px;
    }

    .menu-search-input::placeholder { color: var(--fh-text-muted); }

    .menu-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--fh-text-muted);
    }

    .header-branch-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--fh-line);
      border-radius: 20px;
      background: var(--fh-panel);
      font-size: 13px;
    }

    .branch-select {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .header-cart-btn {
      position: relative;
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fh-text);
    }

    .header-cart-btn .icon { width: 24px; height: 24px; }

    .header-cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--fh-gold);
      color: var(--fh-green-dark);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    /* =============== CATEGORY PILLS =============== */
    .category-pills-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-pills { display: flex; gap: 8px; padding-bottom: 16px; }

    .category-pills::-webkit-scrollbar { display: none; }

    .category-pill {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--fh-line);
      border-radius: 20px;
      background: var(--fh-panel);
      color: var(--fh-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .category-pill:hover { border-color: var(--fh-gold); }

    .category-pill.active {
      border-color: var(--fh-green);
      background: var(--fh-green);
      color: var(--fh-gold);
    }

    /* =============== PRODUCTS GRID =============== */
    .products-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 28px;
      }
    }

    .product-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--fh-panel);
      border: 1px solid var(--fh-line);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .product-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: var(--fh-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
      transition: transform 0.3s;
    }

    .product-card:hover .product-image { transform: scale(1.05); }

    .product-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      color: var(--fh-text);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .product-meta {
      font-size: 12px;
      color: var(--fh-text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .product-desc {
      font-size: 13px;
      color: var(--fh-text-muted);
      margin-bottom: 16px;
      flex: 1;
      line-height: 1.4;
    }

    .product-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn-add {
      flex: 1;
      padding: 10px 16px;
      background: var(--fh-gold);
      color: var(--fh-green-dark);
      border: none;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-add:hover { transform: scale(1.05); }

    .btn-add:active { transform: scale(0.95); }

    /* =============== FLOATING CART =============== */
    .floating-cart-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--fh-green);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      transition: all 0.2s;
    }

    .floating-cart-btn:hover { transform: translateY(-4px); }

    .floating-cart-btn[hidden] { display: none; }

    .cart-count {
      background: var(--fh-gold);
      color: var(--fh-green-dark);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }

    /* =============== EMPTY STATE =============== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state p {
      font-size: 18px;
      color: var(--fh-text-muted);
    }

    /* =============== SKELETONS =============== */
    .skeleton-card {
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, var(--fh-panel) 25%, var(--fh-bg) 50%, var(--fh-panel) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      aspect-ratio: 1;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeletons-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    @media (min-width: 768px) {
      .skeletons-wrapper {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 28px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="menu-header">
    <div class="menu-header-inner">
      <a href="/menu" class="menu-brand">
        <img src="/assets/images/farmhouse-logo.png" alt="" class="menu-logo" onerror="this.style.display='none'">
        <div class="menu-header-titles">
          <h1>Farmhouse</h1>
          <span>Cocina fresca & casual</span>
        </div>
      </a>
      <div class="menu-search-wrap">
        <svg class="menu-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" class="menu-search-input" type="search" placeholder="Buscar un plato..." aria-label="Buscar en el menú">
      </div>
      <div class="header-branch-pill">
        <span id="headerBranchBadge">Selecciona sede</span>
        <select id="branchSelect" class="branch-select" aria-label="Selecciona tu sucursal">
          <option value="">Cambiar sucursal…</option>
        </select>
      </div>
      <button id="headerCartBtn" class="header-cart-btn" type="button" aria-label="Ver pedido">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="header-cart-count" id="headerCartCount" hidden>0</span>
      </button>
    </div>

    <div class="category-pills-wrap">
      <nav id="categoryPills" class="category-pills"></nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="products-container">
    <div id="productsGrid" class="skeletons-wrapper">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>
  </main>

  <div id="emptyState" class="empty-state" hidden>
    <p>No encontramos platos que coincidan con tu búsqueda.</p>
  </div>

  <!-- FLOATING CART BUTTON -->
  <button id="floatingCartBtn" class="floating-cart-btn" hidden aria-label="Ver pedido">
    <span class="cart-count" id="cartCount">0</span>
    <span>Ver pedido</span>
  </button>

  <script src="/js/modules/menu_app.js" type="module"></script>
</body>
</html>
